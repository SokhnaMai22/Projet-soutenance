$kind: http-request
url: "{{base_url}}/api/ordonnances/{{ordonnance_id}}/valider"
method: POST
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token_patient}}"
scripts:
  - type: afterResponse
    code: pm.test('Statut 403', function(){ pm.response.to.have.status(403); });
    language: text/javascript
order: 1000
